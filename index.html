<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rate, rank, and share the albums you're listening to." />
    <meta name="theme-color" content="#0c0d16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&family=Stack+Sans+Notch:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>Needle</title>
    <!-- Applies the saved accessibility options before first paint (see src/lib/preferences.ts). -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("needle.preferences") || "{}");
        ["theme", "colors", "fontSize", "motion"].forEach(function (key) {
          if (saved[key]) document.documentElement.dataset[key] = saved[key];
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
